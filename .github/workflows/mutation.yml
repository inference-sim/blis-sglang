name: mutation

# The mutation sweep (T7, oracle/mutate.py). It applies one deliberate one-line break at a time and
# fails when the suite that covers it still passes.
#
# It takes about half an hour, so it does not run on every push of every pull request. It runs
#   - on a pull request that carries the label `run-mutation`, whatever its base;
#   - on the integration pull request (head branch m3/integration) and on any pull request into
#     main, so on every push to either;
#   - nightly, on release tags and on demand, in full (a schedule runs from the default branch's
#     copy of this file, so it starts when this file is on main).
# A run for a pull request sweeps only what the pull request changed: the listed mutants of each
# changed file and of each changed test file, and the generated mutants of each ported Go function
# it changed. For the integration pull request that is everything changed since main. A green
# `mutation` run on the exact head of the integration pull request (or a green full sweep started
# by hand on it) is a required step of every cut's checklist: no cut is made without one.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "**.go"
      - "oracle/**"
      - ".github/workflows/mutation.yml"
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Adding a label other than run-mutation starts a run that does nothing; it gets its own group so
# it cannot cancel a sweep in progress.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-mutation' && '-unrelated-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  mutation:
    name: mutation
    # Skipped (it reports skipped, which no branch rule requires) on a pull request that is not
    # into main, is not the integration pull request and does not carry the label.
    # A label event runs it only for the label run-mutation, so another label never repeats a sweep.
    if: >-
      github.event_name != 'pull_request'
      || ((github.event.action != 'labeled' || github.event.label.name == 'run-mutation')
          && (github.base_ref == 'main'
              || github.head_ref == 'm3/integration'
              || contains(github.event.pull_request.labels.*.name, 'run-mutation')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        name: the SGLang commit provenance.go pins
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^\tCommit: *"\([0-9a-f]\{40\}\)",$/\1/p' provenance.go)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: check out SGLang at that commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.pin.outputs.commit }}
          path: sglang-source
          fetch-depth: 1
          persist-credentials: false
      - name: the checkout is that commit
        run: test "$(git -C sglang-source rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: go
        uses: ./.github/actions/go-setup
        with:
          build-cache: mutation
      - name: the mutation sweep
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=()
          if [ -n "${BASE:-}" ]; then mode=(--changed "$BASE"); fi
          python3 -I oracle/mutate.py "${mode[@]}" sglang-source "$RUNNER_TEMP/mutants" | tee mutation-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: mutation
          path: mutation-results.txt
